# Deploy to Google Cloud Run
# This workflow builds a Docker image, pushes it to Artifact Registry, and deploys to Cloud Run

name: Deploy to Cloud Run

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ secrets.GCP_ARTIFACTS_REGION }}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t ${{ secrets.GCP_ARTIFACTS_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nodejs-artifacts/json-server-js-test:${{ github.sha }} .

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ secrets.GCP_ARTIFACTS_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nodejs-artifacts/json-server-js-test:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy json-server-js-test \
          --image=${{ secrets.GCP_ARTIFACTS_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/nodejs-artifacts/json-server-js-test:${{ github.sha }} \
          --region=${{ secrets.GCP_CLOUD_RUN_REGION }} \
          --platform=managed \
          --allow-unauthenticated
